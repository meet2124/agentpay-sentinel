# SAM CLI configuration file for AgentPay Sentinel
# Generated for: ap-south-1
# Usage: sam deploy (uses these defaults; sam deploy --guided overrides interactively)

version = 0.1

[default]
[default.global.parameters]
stack_name = "agentpay-sentinel"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
region = "ap-south-1"
resolve_s3 = true
# Stack outputs will show the API Gateway URL after deployment.
# s3_prefix is used for SAM build artifacts — not the evidence bucket.
s3_prefix = "AgentPay-Sentinel"
stack_name = "AgentPay-Sentinel"
parameter_overrides = "Environment=\"production\" AllowedOrigins=\"https://main.d2qhw74txgs7ha.amplifyapp.com\""
image_repositories = []

